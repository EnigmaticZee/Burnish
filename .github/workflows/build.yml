name: Build

# Every push tests Burnish and builds the app for the runner's own chip. Pushing a version tag
# (v0.2.0) builds the universal app and DMG, signs them with the Developer ID and has Apple
# notarise them when the secrets exist, signs the update for Burnish's own updater and publishes
# a GitHub Release with the DMG and the Sparkle appcast.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Test
        env:
          BURNISH_LEDGER: ${{ runner.temp }}/ledger.json
        run: scripts/test.sh
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Build the app for this chip
        # The tests don't compile the app, widget or command-line targets; a native debug build
        # does, in a fraction of the universal build's time.
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: scripts/build-app.sh
      - name: Set up the Developer ID certificate
        # Only on tags, and only once the secrets exist; until then releases stay ad hoc signed.
        if: startsWith(github.ref, 'refs/tags/v') && env.P12 != ''
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          test -n "$IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as $IDENTITY"
      - name: Set up the notary key
        if: startsWith(github.ref, 'refs/tags/v') && env.P8 != ''
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          printf '%s\n' "$P8" > "$RUNNER_TEMP/app-store-connect.p8"
          {
            echo "APP_STORE_CONNECT_KEY=$RUNNER_TEMP/app-store-connect.p8"
            echo "APP_STORE_CONNECT_KEY_ID=$KEY_ID"
            echo "APP_STORE_CONNECT_ISSUER_ID=$ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Install dmgbuild
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet dmgbuild==1.6.5
      - name: Build universal app and DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: DMGBUILD=.venv/bin/dmgbuild scripts/make-dmg.sh
      - name: Write the accuracy ledger
        # The truth set's result for this build, with the date of the Homebrew data it ran against.
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "ledger.json")))
          d["homebrewSnapshot"] = subprocess.check_output(
              ["git", "log", "-1", "--format=%cs", "--", "Tests/CaskIndexTests/Fixtures/casks.json"], text=True).strip()
          d["commit"] = os.environ.get("GITHUB_SHA", "")[:7]
          d["date"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          os.makedirs("dist", exist_ok=True)
          json.dump(d, open("dist/accuracy.json", "w"), indent=2, sort_keys=True)
          print(json.dumps(d, indent=2))
          PY
      - name: Sign the update and write the Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          KEY="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          SIGNATURE=$(Vendor/Sparkle/bin/sign_update --ed-key-file "$KEY" dist/Burnish.dmg)
          rm -f "$KEY"
          VERSION="$(cat VERSION)"
          BUILD=$(git rev-list --count HEAD)
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          # The notes travel inside the feed, so the update window shows just them, styled.
          NOTES=$(python3 scripts/release-notes-html.py "$VERSION")
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Burnish</title>
              <item>
                <title>Burnish ${VERSION}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <description><![CDATA[${NOTES}]]></description>
                <sparkle:fullReleaseNotesLink>${REPO}/releases</sparkle:fullReleaseNotesLink>
                <enclosure url="${REPO}/releases/download/${GITHUB_REF_NAME}/Burnish.dmg" ${SIGNATURE} type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML
          cat dist/appcast.xml
      - uses: actions/upload-artifact@v4
        # Only a tag build has anything the release job needs.
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Burnish
          path: |
            dist/Burnish.dmg
            dist/appcast.xml
            dist/accuracy.json
            dist/notarised
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to find the previous tag for the changelog link
      - uses: actions/download-artifact@v4
        with:
          name: Burnish
          path: dist
      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            python3 scripts/release-notes-html.py --markdown "$VERSION"
            echo
            echo "## Install"
            echo
            echo "Download **[Burnish.dmg]($REPO/releases/download/${GITHUB_REF_NAME}/Burnish.dmg)** (macOS 14 or later, Apple silicon and Intel), open it and drag Burnish into Applications."
            echo
            if [ -f dist/notarised ]; then
              echo "Signed with a Developer ID and notarised by Apple, so it opens like any other app. After that it updates itself."
            else
              echo "Burnish isn't notarised by Apple yet, so the first time you open it macOS asks you to confirm: open it once, click **Done**, then **System Settings → Privacy & Security → Open Anyway**. After that it updates itself."
            fi
            echo
            echo "## Checksum (SHA-256)"
            echo
            echo '```'
            (cd dist && sha256sum Burnish.dmg)
            echo '```'
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog:** [$PREV...${GITHUB_REF_NAME}]($REPO/compare/$PREV...${GITHUB_REF_NAME})"
            fi
          } > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Burnish.dmg dist/appcast.xml dist/accuracy.json \
            --title "Burnish ${GITHUB_REF_NAME#v}" --notes-file notes.md --latest
      - name: Refresh the website's What's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
