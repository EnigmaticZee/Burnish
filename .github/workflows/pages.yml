name: Website

# Builds the homepage from site/ and publishes it to GitHub Pages. "What's new" always shows the
# newest published release, so the page redeploys when the site changes on main and after every
# release (the Build workflow starts this one once the release is up).
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build-site.py", "scripts/release-notes-html.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site for the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          # The accuracy ledger that release's build wrote; older releases have none.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern accuracy.json --dir "$RUNNER_TEMP" || true
          python3 scripts/build-site.py "${TAG#v}" _site "--ledger=$RUNNER_TEMP/accuracy.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
